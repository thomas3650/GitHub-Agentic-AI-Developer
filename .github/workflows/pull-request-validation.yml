name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GitHubAgenticAIDeveloper.slnx

      - name: Build
        run: dotnet build GitHubAgenticAIDeveloper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GitHubAgenticAIDeveloper.slnx --configuration Release --no-build
