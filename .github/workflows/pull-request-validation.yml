name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GitHubAgenticAIDeveloper.slnx

      - name: Build
        run: dotnet build GitHubAgenticAIDeveloper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GitHubAgenticAIDeveloper.slnx --configuration Release --no-build
