name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot Review
        uses: github/copilot-code-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-prompt: |
            You are reviewing a C# weather API project (.NET 10.0). Provide focused feedback on:

            **Priority Areas:**
            1. **Security** - Flag any security vulnerabilities in API endpoints, authentication, data handling
            2. **C# Best Practices** - Verify code follows C# conventions, naming, SOLID principles
            3. **.NET 10.0 Compatibility** - Check for compatibility issues with .NET 10.0
            4. **Async/Await Patterns** - Verify proper async/await usage (no blocking calls, proper ConfigureAwait)
            5. **Unit Test Coverage** - Flag missing tests or suggest test improvements
            6. **API Design** - Check REST endpoint design, error handling, response formats
            7. **Spelling & Grammar** - Check for spelling mistakes and grammar errors in code comments, variable names, and documentation

            **For Renovate/Dependency Update PRs:**
            - Verify dependency updates are safe and stable
            - Check for known breaking changes in major version updates
            - Highlight if security patches are included
            - Warn if dependencies have low maintenance activity

            **Do NOT comment on:**
            - Minor style issues (formatting, indentation)
            - Whitespace changes
            - Auto-generated code
            - Simple comment/documentation formatting

            Keep comments concise and actionable. Use the code review format with specific line references.
