name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Request Copilot Review via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --comment \
            --body "## Copilot Code Review

          Reviewing this PR for:
          - **Security** - API endpoint vulnerabilities, authentication, data handling
          - **C# Best Practices** - Code follows C# conventions, naming, SOLID principles
          - **.NET 10.0 Compatibility** - Framework compatibility issues
          - **Async/Await Patterns** - Proper async usage without blocking calls
          - **Unit Test Coverage** - Test presence and quality
          - **API Design** - REST endpoint design, error handling, response formats
          - **Spelling & Grammar** - Code comments, variable names, documentation

          For Renovate PRs: Verifying dependency updates are safe, checking for breaking changes, highlighting security patches.

          ✅ This is an automated initial review - not a replacement for human reviews."
